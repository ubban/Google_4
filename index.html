<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sky Fighter</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b1d3a;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #gameCanvas {
    display: block;
    margin: 0 auto;
    background: linear-gradient(#4fa8ff, #a9dcff);
  }
  #hud {
    position: absolute;
    top: 10px; left: 50%; transform: translateX(-50%);
    color: #fff;
    text-shadow: 1px 1px 2px #000;
    font-size: 20px;
    display: flex;
    gap: 30px;
    pointer-events: none;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff;
    background: rgba(0,0,0,0.6);
    text-align: center;
  }
  #overlay h1 { font-size: 48px; margin-bottom: 10px; text-shadow: 2px 2px 4px #000; }
  #overlay p { font-size: 18px; margin: 6px; }
  #startBtn {
    margin-top: 20px;
    padding: 12px 30px;
    font-size: 20px;
    background: #ffcc00;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  #startBtn:hover { background: #ffe066; }
  #container { position: relative; width: 100%; height: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="container">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Lives: <span id="lives">3</span></div>
  </div>
  <div id="overlay">
    <h1 id="overlayTitle">Sky Fighter</h1>
    <p>Arrow keys / WASD to move, Space to shoot.</p>
    <p>Shoot down enemy planes, avoid collisions!</p>
    <button id="startBtn">Start Game</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const startBtn = document.getElementById('startBtn');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');

function resize() {
  canvas.width = Math.min(window.innerWidth, 900);
  canvas.height = Math.min(window.innerHeight, 600);
}
resize();
window.addEventListener('resize', resize);

let keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

let player, bullets, enemies, enemyBullets, particles, score, lives, running, spawnTimer, frame;

function resetGame() {
  player = { x: canvas.width/2, y: canvas.height - 80, w: 40, h: 40, speed: 5, cooldown: 0 };
  bullets = [];
  enemies = [];
  enemyBullets = [];
  particles = [];
  score = 0;
  lives = 3;
  spawnTimer = 0;
  frame = 0;
  running = true;
  scoreEl.textContent = score;
  livesEl.textContent = lives;
}

function drawPlane(x, y, w, h, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -h/2);
  ctx.lineTo(w/2, h/2);
  ctx.lineTo(w/4, h/3);
  ctx.lineTo(-w/4, h/3);
  ctx.lineTo(-w/2, h/2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function spawnEnemy() {
  const x = 30 + Math.random() * (canvas.width - 60);
  enemies.push({ x, y: -30, w: 34, h: 34, speed: 1.5 + Math.random()*1.5, shootTimer: Math.floor(Math.random()*60)+30 });
}

function rectsOverlap(a, b) {
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2;
}

function spawnExplosion(x, y, color) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*6,
      vy: (Math.random()-0.5)*6,
      life: 30,
      color
    });
  }
}

function update() {
  frame++;

  if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
  if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
  if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
  player.x = Math.max(player.w/2, Math.min(canvas.width - player.w/2, player.x));
  player.y = Math.max(player.h/2, Math.min(canvas.height - player.h/2, player.y));

  if (player.cooldown > 0) player.cooldown--;
  if (keys['Space'] && player.cooldown <= 0) {
    bullets.push({ x: player.x, y: player.y - player.h/2, w: 4, h: 10, speed: 8 });
    player.cooldown = 10;
  }

  bullets.forEach(b => b.y -= b.speed);
  bullets = bullets.filter(b => b.y > -20);

  enemyBullets.forEach(b => b.y += b.speed);
  enemyBullets = enemyBullets.filter(b => b.y < canvas.height + 20);

  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = Math.max(20, 60 - Math.floor(frame/200));
  }

  enemies.forEach(en => {
    en.y += en.speed;
    en.shootTimer--;
    if (en.shootTimer <= 0) {
      enemyBullets.push({ x: en.x, y: en.y + en.h/2, w: 4, h: 10, speed: 4 });
      en.shootTimer = Math.floor(Math.random()*90) + 60;
    }
  });
  enemies = enemies.filter(en => {
    if (en.y > canvas.height + 30) return false;
    return true;
  });

  // bullet vs enemy
  for (let i = enemies.length - 1; i >= 0; i--) {
    const en = enemies[i];
    for (let j = bullets.length - 1; j >= 0; j--) {
      if (rectsOverlap(en, bullets[j])) {
        spawnExplosion(en.x, en.y, '#ff8800');
        enemies.splice(i, 1);
        bullets.splice(j, 1);
        score += 10;
        scoreEl.textContent = score;
        break;
      }
    }
  }

  // player vs enemy
  for (let i = enemies.length - 1; i >= 0; i--) {
    if (rectsOverlap(enemies[i], player)) {
      spawnExplosion(player.x, player.y, '#ff3333');
      enemies.splice(i, 1);
      loseLife();
    }
  }

  // player vs enemy bullets
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    if (rectsOverlap(enemyBullets[i], player)) {
      enemyBullets.splice(i, 1);
      spawnExplosion(player.x, player.y, '#ff3333');
      loseLife();
    }
  }

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);
}

function loseLife() {
  lives--;
  livesEl.textContent = lives;
  if (lives <= 0) {
    endGame();
  }
}

function endGame() {
  running = false;
  overlayTitle.textContent = 'Game Over — Score: ' + score;
  startBtn.textContent = 'Play Again';
  overlay.hidden = false;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 5; i++) {
    const cy = (frame*1.2 + i*120) % (canvas.height + 60) - 30;
    ctx.beginPath();
    ctx.ellipse(80 + i*160 % canvas.width, cy, 30, 12, 0, 0, Math.PI*2);
    ctx.fill();
  }

  drawPlane(player.x, player.y, player.w, player.h, '#1976d2');

  ctx.fillStyle = '#ffee58';
  bullets.forEach(b => ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h));

  ctx.fillStyle = '#ff5252';
  enemyBullets.forEach(b => ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h));

  enemies.forEach(en => drawPlane(en.x, en.y, en.w, en.h, '#c62828'));

  particles.forEach(p => {
    ctx.globalAlpha = Math.max(p.life / 30, 0);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
    ctx.globalAlpha = 1;
  });
}

function loop() {
  if (running) {
    update();
    draw();
  }
  requestAnimationFrame(loop);
}

startBtn.addEventListener('click', () => {
  resetGame();
  overlay.hidden = true;
});

requestAnimationFrame(loop);
</script>
</body>
</html>
