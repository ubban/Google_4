<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Sky Fighter — an arcade airplane shooter. Dodge and destroy enemy planes to rack up your high score.">
<meta name="theme-color" content="#0b1d3a">
<title>Sky Fighter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b1d3a'/%3E%3Cpath d='M16 4l8 16-8-4-8 4z' fill='%231976d2'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
    background: #05122b;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    touch-action: none;
    user-select: none;
  }
  #container {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #05122b;
  }
  #gameCanvas {
    display: block;
    background: linear-gradient(#4fa8ff, #a9dcff);
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    max-width: 100%;
    max-height: 100%;
    touch-action: none;
  }
  #hud {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%);
    color: #fff;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    font-size: clamp(13px, 3vw, 17px);
    display: flex;
    gap: clamp(10px, 3vw, 18px);
    pointer-events: none;
    z-index: 5;
    white-space: nowrap;
  }
  #hud .stat {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.32);
    border: 1px solid rgba(255,255,255,0.25);
    padding: 6px 12px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
  }
  #hud .label { opacity: 0.75; font-weight: 400; }
  #hud .val { font-weight: 700; color: #ffd54f; }
  #hearts { display: flex; gap: 3px; }
  #hearts span { font-size: clamp(13px, 3vw, 17px); filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.8)); }
  #hearts span.lost { opacity: 0.25; filter: none; }
  #comboPop {
    position: absolute;
    left: 50%; top: 30%;
    transform: translate(-50%, -50%) scale(0.6);
    color: #fff176;
    font-size: clamp(20px, 6vw, 36px);
    font-weight: 800;
    text-shadow: 0 0 10px rgba(255,193,7,0.9), 2px 2px 4px rgba(0,0,0,0.8);
    pointer-events: none;
    z-index: 6;
    opacity: 0;
    letter-spacing: 1px;
  }
  #comboPop.show {
    animation: comboPulse 0.6s ease-out;
  }
  @keyframes comboPulse {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    25% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    60% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -55%) scale(1); }
  }
  #topBar {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    z-index: 6;
    display: flex; gap: 8px;
  }
  .iconBtn {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .iconBtn:active { background: rgba(255,255,255,0.25); }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff;
    background: rgba(3,10,25,0.82);
    text-align: center;
    z-index: 10;
    padding: 20px;
  }
  #overlay h1 {
    font-size: clamp(32px, 8vw, 52px);
    margin: 0 0 6px;
    text-shadow: 0 0 24px rgba(25,118,210,0.8), 2px 2px 6px #000;
    letter-spacing: 1px;
    background: linear-gradient(180deg, #fff 20%, #ffd54f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #overlay p { font-size: clamp(13px, 3vw, 16px); margin: 4px; opacity: 0.85; max-width: 420px; }
  #overlayCard {
    background: rgba(10,22,48,0.55);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: clamp(24px, 5vw, 40px) clamp(20px, 6vw, 48px);
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  #statsRow { display: flex; gap: 24px; margin: 14px 0; font-size: clamp(14px, 3vw, 18px); }
  #statsRow b { color: #ffd54f; }
  #newBest {
    color: #7CFC00;
    font-weight: 700;
    font-size: clamp(13px, 3vw, 16px);
    margin: 0 0 4px;
    text-shadow: 0 0 10px rgba(124,252,0,0.6);
  }
  #startBtn {
    margin-top: 18px;
    padding: 14px 38px;
    font-size: clamp(16px, 4vw, 20px);
    background: linear-gradient(180deg, #ffe066, #ffcc00);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 700;
    color: #3a2a00;
    box-shadow: 0 4px 14px rgba(255,204,0,0.5), inset 0 1px 0 rgba(255,255,255,0.6);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  #startBtn:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(255,204,0,0.4); }
  #diffRow { display: flex; gap: 10px; margin-top: 16px; }
  .diffBtn {
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.05);
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .diffBtn:active { transform: scale(0.94); }
  .diffBtn.active { background: #1976d2; border-color: #64b5f6; box-shadow: 0 0 12px rgba(25,118,210,0.6); }
  #touchControls {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: none;
    pointer-events: none;
  }
  #touchControls.enabled { display: block; }
  #moveZone {
    position: absolute; left: 0; bottom: 0; width: 55%; height: 55%;
    pointer-events: auto;
  }
  #fireZone {
    position: absolute; right: 0; bottom: 0; width: 45%; height: 55%;
    pointer-events: auto;
    display: flex; align-items: flex-end; justify-content: flex-end;
    padding: 20px;
  }
  #fireBtn {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: rgba(255,82,82,0.45);
    border: 2px solid rgba(255,255,255,0.6);
    color: #fff;
    font-weight: bold;
    font-size: 14px;
  }
  #joystickBase {
    position: absolute;
    width: 100px; height: 100px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.4);
    display: none;
  }
  #joystickStick {
    position: absolute;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    left: 28px; top: 28px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="container">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="stat"><span class="label">Score</span><span class="val" id="score">0</span></div>
    <div class="stat"><span class="label">Best</span><span class="val" id="best">0</span></div>
    <div class="stat" id="hearts"></div>
  </div>

  <div id="comboPop"></div>

  <div id="topBar">
    <button id="muteBtn" class="iconBtn" title="Mute/unmute">🔊</button>
    <button id="pauseBtn" class="iconBtn" title="Pause">⏸</button>
  </div>

  <div id="touchControls">
    <div id="moveZone"></div>
    <div id="joystickBase"><div id="joystickStick"></div></div>
    <div id="fireZone"><button id="fireBtn">FIRE</button></div>
  </div>

  <div id="overlay">
    <div id="overlayCard">
      <h1 id="overlayTitle">Sky Fighter</h1>
      <p id="overlaySub">Arrow keys / WASD to move, Space to shoot. On mobile: drag left side to fly, tap FIRE.</p>
      <p id="newBest" hidden>🏆 New Best Score!</p>
      <div id="statsRow" hidden>
        <div>Score: <b id="finalScore">0</b></div>
        <div>Best: <b id="finalBest">0</b></div>
      </div>
      <div id="diffRow">
        <button class="diffBtn" data-diff="easy">Easy</button>
        <button class="diffBtn active" data-diff="normal">Normal</button>
        <button class="diffBtn" data-diff="hard">Hard</button>
      </div>
      <button id="startBtn">Start Game</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const statsRow = document.getElementById('statsRow');
  const finalScoreEl = document.getElementById('finalScore');
  const finalBestEl = document.getElementById('finalBest');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const heartsEl = document.getElementById('hearts');
  const comboPopEl = document.getElementById('comboPop');
  const newBestEl = document.getElementById('newBest');
  const muteBtn = document.getElementById('muteBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const touchControls = document.getElementById('touchControls');
  const moveZone = document.getElementById('moveZone');
  const joystickBase = document.getElementById('joystickBase');
  const joystickStick = document.getElementById('joystickStick');
  const fireBtn = document.getElementById('fireBtn');
  const diffButtons = document.querySelectorAll('.diffBtn');

  const STORAGE_BEST = 'skyfighter.bestScore';
  const STORAGE_MUTE = 'skyfighter.muted';
  const STORAGE_DIFF = 'skyfighter.difficulty';

  const DIFFICULTIES = {
    easy:   { spawnBase: 75, spawnMin: 38, enemySpeed: 1.1, enemyShootChance: 0.55, lives: 4 },
    normal: { spawnBase: 60, spawnMin: 24, enemySpeed: 1.5, enemyShootChance: 0.8,  lives: 3 },
    hard:   { spawnBase: 42, spawnMin: 16, enemySpeed: 2.1, enemyShootChance: 1.0,  lives: 3 }
  };

  let bestScore = Number(localStorage.getItem(STORAGE_BEST)) || 0;
  let muted = localStorage.getItem(STORAGE_MUTE) === '1';
  let difficulty = localStorage.getItem(STORAGE_DIFF) || 'normal';
  bestEl.textContent = bestScore;
  updateMuteBtn();
  setDifficulty(difficulty);

  // ---------- Audio (WebAudio synth, no external assets) ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type, vol) {
    if (muted || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.08;
    osc.connect(gain).connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(gain.gain.value, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.start(now);
    osc.stop(now + dur);
  }
  const sfx = {
    shoot: () => beep(880, 0.08, 'square', 0.05),
    explode: () => beep(120, 0.25, 'sawtooth', 0.12),
    hit: () => beep(200, 0.3, 'triangle', 0.15),
    gameover: () => { beep(300, 0.2, 'sawtooth', 0.15); setTimeout(() => beep(150, 0.4, 'sawtooth', 0.15), 150); }
  };

  function renderHearts(count, max) {
    let html = '';
    for (let i = 0; i < max; i++) {
      html += `<span class="${i < count ? '' : 'lost'}">❤️</span>`;
    }
    heartsEl.innerHTML = html;
  }

  let comboPopTimer = null;
  function showComboPop(text) {
    comboPopEl.textContent = text;
    comboPopEl.classList.remove('show');
    void comboPopEl.offsetWidth;
    comboPopEl.classList.add('show');
  }

  let shakeTime = 0, shakeMag = 0;
  function screenShake(mag, dur) {
    shakeMag = mag;
    shakeTime = dur;
  }

  function updateMuteBtn() {
    muteBtn.textContent = muted ? '🔇' : '🔊';
  }
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    localStorage.setItem(STORAGE_MUTE, muted ? '1' : '0');
    updateMuteBtn();
  });

  function setDifficulty(name) {
    difficulty = name;
    localStorage.setItem(STORAGE_DIFF, name);
    diffButtons.forEach(b => b.classList.toggle('active', b.dataset.diff === name));
  }
  diffButtons.forEach(b => b.addEventListener('click', () => {
    if (running && !paused) return;
    setDifficulty(b.dataset.diff);
  }));

  // ---------- Canvas sizing ----------
  const BASE_W = 480, BASE_H = 720;
  function resize() {
    const maxW = window.innerWidth;
    const maxH = window.innerHeight;
    const scale = Math.min(maxW / BASE_W, maxH / BASE_H, 1.6);
    canvas.width = BASE_W;
    canvas.height = BASE_H;
    canvas.style.width = Math.floor(BASE_W * scale) + 'px';
    canvas.style.height = Math.floor(BASE_H * scale) + 'px';
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // ---------- Input ----------
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
    if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    ensureAudio();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouchDevice) touchControls.classList.add('enabled');

  let joyActive = false, joyId = null, joyOrigin = { x: 0, y: 0 };
  let joyVec = { x: 0, y: 0 };
  let firing = false;

  function joystickStart(clientX, clientY, id) {
    joyActive = true;
    joyId = id;
    joyOrigin = { x: clientX, y: clientY };
    joystickBase.style.left = (clientX - 50) + 'px';
    joystickBase.style.top = (clientY - 50) + 'px';
    joystickBase.style.display = 'block';
    joystickStick.style.left = '28px';
    joystickStick.style.top = '28px';
  }
  function joystickMove(clientX, clientY) {
    if (!joyActive) return;
    let dx = clientX - joyOrigin.x;
    let dy = clientY - joyOrigin.y;
    const maxDist = 50;
    const dist = Math.hypot(dx, dy);
    if (dist > maxDist) { dx = dx / dist * maxDist; dy = dy / dist * maxDist; }
    joystickStick.style.left = (28 + dx) + 'px';
    joystickStick.style.top = (28 + dy) + 'px';
    joyVec.x = dx / maxDist;
    joyVec.y = dy / maxDist;
  }
  function joystickEnd() {
    joyActive = false;
    joyId = null;
    joyVec = { x: 0, y: 0 };
    joystickBase.style.display = 'none';
  }

  moveZone.addEventListener('touchstart', e => {
    e.preventDefault();
    ensureAudio();
    const t = e.changedTouches[0];
    joystickStart(t.clientX, t.clientY, t.identifier);
  }, { passive: false });
  moveZone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === joyId) joystickMove(t.clientX, t.clientY);
  }, { passive: false });
  window.addEventListener('touchend', e => {
    for (const t of e.changedTouches) if (t.identifier === joyId) joystickEnd();
  });
  window.addEventListener('touchcancel', () => joystickEnd());

  fireBtn.addEventListener('touchstart', e => { e.preventDefault(); ensureAudio(); firing = true; }, { passive: false });
  fireBtn.addEventListener('touchend', e => { e.preventDefault(); firing = false; }, { passive: false });
  fireBtn.addEventListener('mousedown', () => { firing = true; });
  window.addEventListener('mouseup', () => { firing = false; });

  // ---------- Game state ----------
  let player, bullets, enemies, enemyBullets, particles, powerUps;
  let score = 0, lives = 3, maxLives = 3, running = false, paused = false, gameOver = false;
  let spawnTimer = 0, frame = 0, kills = 0;
  let lastTime = 0;

  function resetGame() {
    const d = DIFFICULTIES[difficulty];
    player = { x: canvas.width / 2, y: canvas.height - 100, w: 40, h: 40, speed: 260, cooldown: 0, rapid: 0 };
    bullets = [];
    enemies = [];
    enemyBullets = [];
    particles = [];
    powerUps = [];
    score = 0;
    lives = d.lives;
    spawnTimer = 0;
    frame = 0;
    running = true;
    paused = false;
    gameOver = false;
    scoreEl.textContent = score;
    maxLives = lives;
    renderHearts(lives, maxLives);
    bestEl.textContent = bestScore;
    pauseBtn.textContent = '⏸';
    kills = 0;
  }

  function drawPlane(x, y, w, h, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, -h / 2);
    ctx.lineTo(w / 2, h / 2);
    ctx.lineTo(w / 4, h / 3);
    ctx.lineTo(-w / 4, h / 3);
    ctx.lineTo(-w / 2, h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function spawnEnemy() {
    const d = DIFFICULTIES[difficulty];
    const x = 30 + Math.random() * (canvas.width - 60);
    enemies.push({
      x, y: -30, w: 34, h: 34,
      speed: d.enemySpeed + Math.random() * 1.2,
      shootTimer: Math.floor(Math.random() * 60) + 30,
      canShoot: Math.random() < d.enemyShootChance
    });
  }

  function maybeSpawnPowerUp(x, y) {
    if (Math.random() < 0.12) {
      powerUps.push({ x, y, w: 20, h: 20, speed: 90, type: 'rapid' });
    }
  }

  function rectsOverlap(a, b) {
    return Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2;
  }

  function spawnExplosion(x, y, color) {
    for (let i = 0; i < 14; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 200,
        vy: (Math.random() - 0.5) * 200,
        life: 0.5,
        maxLife: 0.5,
        color
      });
    }
  }

  function update(dt) {
    frame++;
    const d = DIFFICULTIES[difficulty];

    let mvx = 0, mvy = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) mvx -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) mvx += 1;
    if (keys['ArrowUp'] || keys['KeyW']) mvy -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) mvy += 1;
    if (joyActive) { mvx += joyVec.x; mvy += joyVec.y; }
    const mag = Math.hypot(mvx, mvy);
    if (mag > 1) { mvx /= mag; mvy /= mag; }

    player.x += mvx * player.speed * dt;
    player.y += mvy * player.speed * dt;
    player.x = Math.max(player.w / 2, Math.min(canvas.width - player.w / 2, player.x));
    player.y = Math.max(player.h / 2, Math.min(canvas.height - player.h / 2, player.y));

    if (player.rapid > 0) player.rapid -= dt;
    if (player.cooldown > 0) player.cooldown -= dt;
    const wantsFire = keys['Space'] || firing;
    const fireDelay = player.rapid > 0 ? 0.08 : 0.16;
    if (wantsFire && player.cooldown <= 0) {
      bullets.push({ x: player.x, y: player.y - player.h / 2, w: 4, h: 10, speed: 480 });
      player.cooldown = fireDelay;
      sfx.shoot();
    }

    bullets.forEach(b => b.y -= b.speed * dt);
    bullets = bullets.filter(b => b.y > -20);

    enemyBullets.forEach(b => b.y += b.speed * dt);
    enemyBullets = enemyBullets.filter(b => b.y < canvas.height + 20);

    powerUps.forEach(p => p.y += p.speed * dt);
    powerUps = powerUps.filter(p => p.y < canvas.height + 20);

    spawnTimer -= dt * 60;
    if (spawnTimer <= 0) {
      spawnEnemy();
      const difficultyRamp = Math.floor(frame / 300) * 4;
      spawnTimer = Math.max(d.spawnMin, d.spawnBase - difficultyRamp);
    }

    enemies.forEach(en => {
      en.y += en.speed * dt * 60;
      en.shootTimer -= dt * 60;
      if (en.canShoot && en.shootTimer <= 0) {
        enemyBullets.push({ x: en.x, y: en.y + en.h / 2, w: 4, h: 10, speed: 220 });
        en.shootTimer = Math.floor(Math.random() * 90) + 60;
      }
    });
    enemies = enemies.filter(en => en.y <= canvas.height + 30);

    for (let i = enemies.length - 1; i >= 0; i--) {
      const en = enemies[i];
      for (let j = bullets.length - 1; j >= 0; j--) {
        if (rectsOverlap(en, bullets[j])) {
          spawnExplosion(en.x, en.y, '#ff8800');
          maybeSpawnPowerUp(en.x, en.y);
          enemies.splice(i, 1);
          bullets.splice(j, 1);
          score += 10;
          scoreEl.textContent = score;
          sfx.explode();
          kills++;
          if (kills > 0 && kills % 10 === 0) showComboPop(kills + ' KILLS!');
          break;
        }
      }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      if (rectsOverlap(enemies[i], player)) {
        spawnExplosion(player.x, player.y, '#ff3333');
        enemies.splice(i, 1);
        loseLife();
      }
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      if (rectsOverlap(enemyBullets[i], player)) {
        enemyBullets.splice(i, 1);
        spawnExplosion(player.x, player.y, '#ff3333');
        loseLife();
      }
    }

    for (let i = powerUps.length - 1; i >= 0; i--) {
      if (rectsOverlap(powerUps[i], player)) {
        player.rapid = 6;
        powerUps.splice(i, 1);
        beep(660, 0.15, 'sine', 0.1);
      }
    }

    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
    particles = particles.filter(p => p.life > 0);
  }

  function loseLife() {
    if (gameOver) return;
    lives--;
    renderHearts(Math.max(lives, 0), maxLives);
    sfx.hit();
    screenShake(10, 0.3);
    if (lives <= 0) endGame();
  }

  function endGame() {
    running = false;
    gameOver = true;
    sfx.gameover();
    screenShake(16, 0.4);
    const isNewBest = score > bestScore;
    if (isNewBest) {
      bestScore = score;
      localStorage.setItem(STORAGE_BEST, String(bestScore));
    }
    overlayTitle.textContent = 'Game Over';
    overlaySub.hidden = true;
    newBestEl.hidden = !isNewBest;
    statsRow.hidden = false;
    finalScoreEl.textContent = score;
    finalBestEl.textContent = bestScore;
    startBtn.textContent = 'Play Again';
    overlay.hidden = false;
  }

  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '▶' : '⏸';
    if (paused) {
      overlayTitle.textContent = 'Paused';
      overlaySub.hidden = true;
      statsRow.hidden = true;
      startBtn.textContent = 'Resume';
      overlay.hidden = false;
    } else {
      overlay.hidden = true;
    }
  }
  pauseBtn.addEventListener('click', togglePause);

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    if (shakeTime > 0) {
      const sx = (Math.random() - 0.5) * shakeMag;
      const sy = (Math.random() - 0.5) * shakeMag;
      ctx.translate(sx, sy);
    }

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let i = 0; i < 6; i++) {
      const cy = (frame * 1.2 + i * 130) % (canvas.height + 60) - 30;
      const cx = (80 + i * 160) % canvas.width;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 30, 12, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    if (player.rapid > 0) {
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#7CFC00';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.w * 0.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    drawPlane(player.x, player.y, player.w, player.h, '#1976d2');

    ctx.fillStyle = '#ffee58';
    bullets.forEach(b => ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h));

    ctx.fillStyle = '#ff5252';
    enemyBullets.forEach(b => ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h));

    enemies.forEach(en => drawPlane(en.x, en.y, en.w, en.h, '#c62828'));

    ctx.fillStyle = '#7CFC00';
    powerUps.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(frame * 0.1);
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });

    particles.forEach(p => {
      ctx.globalAlpha = Math.max(p.life / p.maxLife, 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 4, 4);
      ctx.globalAlpha = 1;
    });
    ctx.restore();
  }

  function loop(now) {
    if (!lastTime) lastTime = now;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    dt = Math.min(dt, 0.05);

    if (running && !paused) {
      update(dt);
      if (shakeTime > 0) shakeTime -= dt;
      draw();
    }
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', () => {
    ensureAudio();
    if (paused) { togglePause(); return; }
    resetGame();
    overlaySub.hidden = false;
    statsRow.hidden = true;
    newBestEl.hidden = true;
    overlay.hidden = true;
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
